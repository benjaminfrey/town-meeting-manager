# Town Meeting Manager — nginx placeholder for the tmm dev/staging VM
#
# STAGE 1 PLACEHOLDER — not yet installed on the VM.
#
# nginx 1.26.3 is installed and running on the VM (Task 6, Step 2) so the box
# is ready, but there is no application to reverse-proxy to yet: Stage 1 has
# not built the Fastify API or a web build output. Writing a full server
# block now (upstream ports, static file root, TLS, etc.) would be inventing
# configuration against endpoints that do not exist and cannot be tested —
# the Task 6 brief calls that out explicitly as worse than a documented
# placeholder.
#
# What IS true today: nginx is running its distro-default site
# (`/etc/nginx/sites-enabled/default`, listening on 127.0.0.1:80/[::1]:80 —
# Debian's default `listen` directives are not bound to a public interface
# by themselves, but see the README's networking section for the full
# picture) and has not been touched beyond `apt-get install`.
#
# When Stage 1 ships a Fastify process and a web build, replace this file
# with a real server block that at minimum:
#   - `listen 127.0.0.1:80;` (or a Unix socket) — nginx should not be
#     reachable from the LAN any more than Postgres is; reach it over the
#     same kind of SSH tunnel used for Postgres, or put a real TLS
#     terminator in front of it later.
#   - `location /api/ { proxy_pass http://127.0.0.1:<fastify-port>; }` for
#     the Fastify API.
#   - `location / { root <path-to-web-build>; try_files $uri /index.html; }`
#     for the SPA build output.
#   - Standard `proxy_set_header Host/X-Real-IP/X-Forwarded-For/Proto`
#     headers on the API location.
#
# Until then, do not `nginx -s reload` this file into sites-enabled — it is
# not wired to anything and would only 502.
