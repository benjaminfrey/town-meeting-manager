# ─────────────────────────────────────────────────────────────────────
# Town Meeting Manager — Production Nginx (containerized reverse proxy)
#
# This is the COMPLETE nginx.conf mounted at /etc/nginx/nginx.conf.
# Upstreams are Docker service names on the `tmm` network, re-resolved at
# request time via Docker's embedded DNS (127.0.0.11) so Nginx survives
# container restarts without a reload.
#
# Hosts:
#   app.townmeetingmanager.com       → static web SPA (admin/board UI)
#   api.townmeetingmanager.com       → Fastify API (api:3001)
#   *.townmeetingmanager.com         → public portal SPA (per-town subdomain)
#
# The host-based infrastructure/nginx/portal.conf (session 10.01) is an
# older, non-containerized variant of the portal server block below. The
# Docker Compose deployment this file was written for was removed in
# Phase F — see docs/deployment.md. A replacement deployment (a process
# manager for the Fastify API, this config or something like it, and a
# migration path) is owned by a separate spec, expected in Stage 2.
# ─────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    client_max_body_size 10M;       # agenda packets / exhibit uploads
    server_tokens off;

    # ── Gzip ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml application/manifest+json;

    # ── Docker embedded DNS ──────────────────────────────────────────
    # Re-resolves proxy_pass targets (the $upstream_* vars below) at request
    # time, so Nginx tolerates API/Kong/Studio container restarts and starts
    # even if an upstream is momentarily unavailable.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # ── Shared SSL settings (wildcard cert covers root + all subdomains) ─
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security headers applied to every response ───────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # =================================================================
    # HTTP :80 — health, ACME challenge, and redirect everything to HTTPS
    # =================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Health check endpoint for an external process manager or load balancer.
        location = /healthz { access_log off; return 200 "ok\n"; }

        # Let's Encrypt HTTP-01 fallback (DNS-01 is primary — issuance and
        # renewal tooling is owned by whatever deployment spec stands this
        # config up; there is none checked into this repository).
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / { return 301 https://$host$request_uri; }
    }

    # =================================================================
    # app.townmeetingmanager.com — admin / board member SPA
    # =================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name app.townmeetingmanager.com;

        ssl_certificate     /etc/letsencrypt/live/townmeetingmanager.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/townmeetingmanager.com/privkey.pem;

        root /var/www/web;
        index index.html;

        set $upstream_api api:3001;

        location = /health { access_log off; return 200 "ok\n"; }

        # Hashed assets — cache hard. Service worker — never cache.
        location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
        location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }

        # ── Stage 1, Task D1e — the PUBLIC asset root ────────────────
        #
        # Town seals, and nothing else. The seal has to be fetchable by
        # something that cannot authenticate: it is rendered into outgoing
        # email (packages/api/src/templates/email/layout.hbs) and fetched by
        # Chromium during PDF generation (templates/agenda-packet.hbs). No
        # route sits in front of it, and none can.
        #
        # The alias points at the `seals/` SUBTREE, not at the root — so a
        # file written beside it by anything other than the one writer in
        # packages/api/src/storage/paths.ts is still not served. That is the
        # third of the three independent guarantees described in that file.
        location /public-assets/seals/ {
            alias /var/lib/tmm/public/seals/;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=300" always;
            add_header X-Content-Type-Options "nosniff" always;
            # These are images. Never execute one, whatever its bytes claim.
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        }

        # ── Stage 1, Task D1e — the AUTHORIZED document root ─────────
        #
        # `internal` means nginx refuses any client request for a URI under
        # this location with 404. The only way to a file here is a response
        # from the API carrying `X-Accel-Redirect`, which it sets only after
        # applying the rule for that document — rule 9 for minutes, rule 14
        # for an exhibit's visibility tier. So authorization is a route
        # decision made per fetch, not a signed URL with a lifetime.
        #
        # Node never opens the file: nginx serves it with sendfile.
        location /__documents/ {
            internal;
            alias /var/lib/tmm/documents/;
        }

        # The API — including Better Auth at /api/auth/* — served from the SAME
        # ORIGIN as the SPA (Stage 1, Task C1). Mirrors the portal block below.
        #
        # This is a security property, not a convenience. A session cookie
        # issued by api.townmeetingmanager.com and sent from
        # app.townmeetingmanager.com is cross-site, which forces
        # `SameSite=None` — meaning the browser attaches it to requests
        # originating from ANY site, and CSRF is held off by nothing but an
        # Origin-header check the application has to get right on every route.
        # Same-origin lets the cookie stay `SameSite=Lax` and puts the browser
        # in charge instead. api.townmeetingmanager.com stays available for
        # server-to-server callers (Postmark webhooks); browsers use this path.
        location /api/ {
            proxy_pass http://$upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;   # PDF generation can be slow
        }

        # ── Phase E, wave 5 — tRPC, including SSE subscriptions ──────
        #
        # A longer prefix than /api/ above, and nginx picks the longest
        # matching prefix location regardless of order, so this governs every
        # tRPC call. It exists for ONE of them: `realtime.onMeetingChange`,
        # the Server-Sent Events stream used for live meeting sync.
        #
        # Config per `docs/advisory-resolutions/5.1-realtime-transport.md`,
        # which tested exactly this block against real nginx on the dev VM.
        #
        #   proxy_buffering off — REQUIRED, not optional. The ADR could not
        #       reproduce the classic "nginx buffers SSE into a hang" failure
        #       even with both protections defeated, and says so honestly; it
        #       also says that is "could not induce it", not "proved
        #       impossible". tRPC's own `X-Accel-Buffering: no` response header
        #       is an implementation detail a future adapter version or an
        #       upstream CDN hop could stop relaying. This line costs nothing.
        #   Connection ""     — keeps the upstream connection out of
        #       `Connection: close`, which is what HTTP/1.1 keep-alive to the
        #       API needs.
        #   proxy_read_timeout — a subscription is idle whenever the meeting
        #       is. The server bounds a stream itself (`SSE_MAX_STREAM_
        #       DURATION_MS` in trpc.ts, five minutes) and sends a keep-alive
        #       comment every 15s, so this only has to be comfortably larger
        #       than both; it is not a request timeout for ordinary tRPC calls,
        #       which finish in milliseconds.
        location /api/trpc/ {
            proxy_pass http://$upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }

        location / { try_files $uri /index.html; }
    }

    # =================================================================
    # api.townmeetingmanager.com — Fastify API
    # =================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name api.townmeetingmanager.com;

        ssl_certificate     /etc/letsencrypt/live/townmeetingmanager.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/townmeetingmanager.com/privkey.pem;

        set $upstream_api api:3001;

        location / {
            proxy_pass http://$upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;   # PDF generation can be slow
        }
    }

    # =================================================================
    # *.townmeetingmanager.com — public portal (per-town subdomain)
    # Regex server_name; exact hosts above are matched first by Nginx.
    # =================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name ~^(?<subdomain>[^.]+)\.townmeetingmanager\.com$;

        ssl_certificate     /etc/letsencrypt/live/townmeetingmanager.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/townmeetingmanager.com/privkey.pem;

        root /var/www/web;
        index index.html;

        set $upstream_api api:3001;

        location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

        # ── Stage 1, Task D1e — the PUBLIC asset root ────────────────
        #
        # Town seals, and nothing else. The seal has to be fetchable by
        # something that cannot authenticate: it is rendered into outgoing
        # email (packages/api/src/templates/email/layout.hbs) and fetched by
        # Chromium during PDF generation (templates/agenda-packet.hbs). No
        # route sits in front of it, and none can.
        #
        # The alias points at the `seals/` SUBTREE, not at the root — so a
        # file written beside it by anything other than the one writer in
        # packages/api/src/storage/paths.ts is still not served. That is the
        # third of the three independent guarantees described in that file.
        location /public-assets/seals/ {
            alias /var/lib/tmm/public/seals/;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=300" always;
            add_header X-Content-Type-Options "nosniff" always;
            # These are images. Never execute one, whatever its bytes claim.
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        }

        # The document root, `internal` — added in Stage 1, Task D1f.
        #
        # D1e deliberately left this OUT of the portal host, and said why: the
        # portal renders town-authored content for anonymous residents, and at
        # the time nothing it served was a stored document. Two routes here
        # now are — `/api/portal/:townId/meetings/:meetingId/minutes/pdf` and
        # `.../agenda/pdf`, which the portal UI links from three pages
        # (MeetingDetail, MinutesView, AgendaView) and which answered 500 on
        # every input until D1f, because they signed URLs against a storage
        # bucket that never existed.
        #
        # What makes adding it safe is the same thing that makes it safe on the
        # app host, and it is a property of `internal`, not of the hostname: a
        # client that requests /__documents/... gets 404 from nginx. The ONLY
        # way to a file here is an `X-Accel-Redirect` on a response this
        # deployment's API produced — and on THIS host the only upstream under
        # /api/ is /api/portal/ (everything else there is 404'd below), so the
        # only responses that can carry one come from `routes/portal.ts`, where
        # every document is gated by a publication predicate:
        # `portalCanSelectMinutesDocument` is `published` only — not merely
        # `approved` — and `portalCanSelectAgenda` requires a published agenda
        # on a meeting the portal lists.
        #
        # There is no session here and no permission; publication IS the
        # authorization, checked on every fetch rather than baked into a signed
        # URL that outlives its withdrawal.
        location /__documents/ {
            internal;
            alias /var/lib/tmm/documents/;
        }

        # SEO endpoints resolve the town from the subdomain header.
        location = /sitemap.xml {
            proxy_pass http://$upstream_api/api/portal/sitemap;
            proxy_set_header Host $host;
            proxy_set_header X-Town-Subdomain $subdomain;
            add_header Cache-Control "public, max-age=3600";
        }
        location = /robots.txt {
            proxy_pass http://$upstream_api/api/portal/robots;
            proxy_set_header Host $host;
            proxy_set_header X-Town-Subdomain $subdomain;
            add_header Cache-Control "public, max-age=86400";
        }

        # ONLY /api/portal/ — narrowed in Stage 1, Task C2 (review round 1).
        #
        # This used to proxy all of /api/, so every authenticated route in the
        # API was reachable at every town's public portal host. Session cookies
        # are host-only on the app. host, so that alone did not authenticate
        # anyone — but it put the entire admin surface on a hostname that
        # renders town-authored content, next to a CORS list that used to
        # allow the whole wildcard WITH credentials. The portal client
        # (packages/web/src/lib/portal-api.ts) only ever calls /api/portal/*,
        # and the sitemap/robots blocks above proxy their own explicit paths,
        # so nothing legitimate is lost.
        location /api/portal/ {
            proxy_pass http://$upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Town-Subdomain $subdomain;
        }

        # Anything else under /api/ is not part of the public portal.
        location /api/ { return 404; }

        # SPA fallback — the app reads the subdomain and renders the portal.
        location / { try_files $uri /index.html; }
    }
}
